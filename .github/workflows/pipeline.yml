name: Tourism Project CI/CD Pipeline   # Name of the workflow

on:
  push:
    branches:
      - main            # Trigger workflow automatically on push to the main branch
  workflow_dispatch:     # Allow manual trigger from the Actions tab

permissions:
  contents: write        # Grant permission to push commits back to the repo

jobs:
  # ---------- JOB 1: Register Dataset ----------
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest              # Use latest Ubuntu runner
    steps:
      - uses: actions/checkout@v4       # Checkout repo code
      - uses: actions/setup-python@v5   # Setup Python environment
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt   # Install project dependencies
      - name: Register dataset
        run: python tourism_project/model_building/data_register.py   # Run dataset registration script
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4   # Save dataset as artifact for later jobs
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------- JOB 2: Data Preparation ----------
  data-preparation:
    name: Data Preparation
    needs: register-dataset          # Wait until Job 1 finishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt   # Install dependencies again
      - name: Prepare data
        run: python tourism_project/model_building/prep.py     # Run preprocessing script
      - name: Upload train/test splits
        uses: actions/upload-artifact@v4   # Save train/test splits for next job
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ---------- JOB 3: Model Training + MLflow Tracking ----------
  model-training:
    name: Model Training
    needs: data-preparation          # Wait until Job 2 finishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt   # Install dependencies
      - name: Download train/test splits
        uses: actions/download-artifact@v4   # Retrieve splits from Job 2
        with:
          name: data-splits
      - name: Start MLflow tracking server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &   # Launch MLflow UI in background
          sleep 5                                        # Wait for server to start
      - name: Train model with MLflow tracking
        run: python tourism_project/model_building/train.py   # Run training script
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"          # Configure bot identity
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model.joblib   # Add trained model
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push                                           # Push model back to repo
